<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="Ritesh Roshan">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' https://avatars.githubusercontent.com data:">
<title>Commit Notch</title>
<link rel="stylesheet" href="style.css?v=237d783">
</head>
<body>
<div class="bar" id="bar">

  <div class="island" role="button" tabindex="0" id="today" aria-label="Today's contributions">
    <div class="layer chip"><span class="week" id="week" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="today-n"><b class="tnum sk" id="todayCount"></b><span class="muted">today</span></span></div>
  </div>

  <div class="island" role="button" tabindex="0" id="gh" aria-expanded="false" aria-label="Contributions">
    <div class="layer chip"><svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/></svg><span class="tnum sk" id="chipStreak"></span></div>
    <div class="layer full" id="ghFull">
      <div class="head">
        <div class="who"><span class="av" id="av"></span><span id="name"></span></div>
        <div class="head-r"><span class="sub tnum" id="total"></span><span class="quit" role="button" tabindex="0" aria-label="Quit Commit Notch" title="Quit Commit Notch"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5v5.5M4.4 3.6a5.5 5.5 0 1 0 7.2 0"/></svg></span></div>
      </div>
      <div class="pages" id="pages">
        <section class="page" data-page="0">
          <div class="months" id="months"></div>
          <div class="grid" id="grid"></div>
        </section>
        <section class="page" data-page="1"><div class="repos" id="latest"></div></section>
        <section class="page" data-page="2"><div class="repos" id="repos"></div></section>
        <section class="page" data-page="3"><div class="kinds" id="kinds"></div></section>
      </div>
      <div class="foot">
        <span class="tnum" id="streak"></span>
        <span class="legend" id="legend">Less <i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> More</span>
      </div>
      <div class="dots" id="dots"><b data-go="0"></b><b data-go="1"></b><b data-go="2"></b><b data-go="3"></b></div>
    </div>
  </div>

  <div class="island" role="button" tabindex="0" id="clk" aria-expanded="false" aria-label="World clock">
    <div class="layer chip tnum"><span id="chipTime"></span><span class="muted" id="chipZone"></span></div>
    <div class="layer full">
      <div class="big tnum"><span id="bigTime"></span><small id="bigMeta"></small></div>
      <div class="sync"><span class="pulse" id="syncDot"></span><span id="syncTxt">Syncing with atomic time…</span></div>
      <div class="cities" id="cities"></div>
    </div>
  </div>

</div>
<script src="sound.js?v=237d783"></script>
<script src="motion.js?v=237d783"></script>
<script src="app.js?v=237d783"></script>
</body>
</html>
