<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="Ritesh Roshan">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Commit Notch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bar" id="bar">

  <div class="island" role="button" tabindex="0" id="today" aria-label="Today's contributions">
    <div class="layer chip"><span class="pulse"></span><span class="tnum" id="todayCount">–</span><span class="muted">today</span><span class="spark" id="spark"></span></div>
  </div>

  <div class="island" role="button" tabindex="0" id="gh" aria-expanded="false" aria-label="Contributions">
    <div class="layer chip"><svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/></svg><span class="tnum" id="chipStreak">–</span></div>
    <div class="layer full" id="ghFull">
      <div class="head">
        <div class="who"><span class="av" id="av">R</span><span id="name">Ritesh Roshan</span></div>
        <span class="sub tnum" id="total"></span>
      </div>
      <div class="pages" id="pages">
        <section class="page" data-page="0">
          <div class="months" id="months"></div>
          <div class="grid" id="grid"></div>
        </section>
        <section class="page" data-page="1"><div class="repos" id="repos"></div></section>
        <section class="page" data-page="2"><div class="kinds" id="kinds"></div></section>
      </div>
      <div class="foot">
        <span class="tnum" id="streak"></span>
        <span class="legend">Less <i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> More</span>
      </div>
      <div class="dots" id="dots"><b data-go="0"></b><b data-go="1"></b><b data-go="2"></b></div>
      <form class="signin" id="signin" hidden>
        <p>Sign in to see your contributions, private repos included.</p>
        <p class="hint">Run <code>gh auth login</code>, or paste a classic token with <code>repo</code> and <code>read:user</code> scopes.</p>
        <div class="row"><input id="token" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false"><button type="submit">Connect</button></div>
        <p class="err" id="tokenErr"></p>
      </form>
    </div>
  </div>

  <div class="island" role="button" tabindex="0" id="clk" aria-expanded="false" aria-label="World clock">
    <div class="layer chip tnum"><span id="chipTime">–</span><span class="muted" id="chipZone"></span></div>
    <div class="layer full">
      <div class="big tnum"><span id="bigTime">–</span><small id="bigMeta"></small></div>
      <div class="sync"><span class="pulse" id="syncDot"></span><span id="syncTxt">Syncing with atomic time…</span></div>
      <div class="cities" id="cities"></div>
    </div>
  </div>

</div>
<script src="sound.js"></script>
<script src="motion.js"></script>
<script src="app.js"></script>
</body>
</html>
